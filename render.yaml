databases:
  - name: mafia-db
    plan: free

services:
  - type: web
    name: mafia-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mafia-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: MAX_PLAYERS
        value: "8"
      - key: MIN_PLAYERS
        value: "5"
      - key: PYTHON_VERSION
        value: "3.12.8"
